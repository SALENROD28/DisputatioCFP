<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dr. Gavin P. Johnson</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f5ee;
      color: #111111;
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      width: min(94%, 1400px);
      margin: 0 auto;
      padding: clamp(20px, 2.8vw, 40px) 0 24px;
    }

    .author-panel {
      padding: clamp(28px, 7.2vw, 104px);
      border-radius: clamp(18px, 2.2vw, 32px);
      background: #eac5c1;
    }

    .author-header {
      padding-bottom: clamp(20px, 2.8vw, 40px);
      border-bottom: 1px solid #111111;
    }

    .section-number {
      margin: 0 0 clamp(12px, 1.8vw, 26px);
      color: #48382f;
      font-size: clamp(1.5rem, 3vw, 2.75rem);
      line-height: 1.15;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 10vw, 9rem);
      line-height: 0.95;
      text-transform: uppercase;
    }

    .author-name {
      margin: clamp(12px, 1.6vw, 23px) 0 0;
      font-size: clamp(1.35rem, 3.5vw, 3.15rem);
      font-weight: normal;
      line-height: 1.2;
    }

    .overview {
      padding-top: clamp(26px, 5.2vw, 75px);
    }

    .overview h2 {
      margin: 0 0 clamp(20px, 2.8vw, 40px);
      font-size: clamp(1.5rem, 3vw, 2.7rem);
      line-height: 1.15;
      text-align: center;
    }

    .overview p {
      margin: 0;
      font-size: clamp(1.05rem, 2.1vw, 1.9rem);
      line-height: 1.7;
    }

    .overview p + p {
      margin-top: 1em;
    }

    .page-nav {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
      gap: 12px;
      margin-top: clamp(20px, 3vw, 44px);
      font-size: clamp(1rem, 1.85vw, 1.65rem);
    }

    .page-nav a {
      color: inherit;
      text-underline-offset: 0.2em;
    }

    .back-link {
      justify-self: start;
    }

    .next-link {
      grid-column: 2;
      justify-self: center;
    }

    @media (max-width: 540px) {
      .page-nav {
        grid-template-columns: 1fr auto;
      }

      .next-link {
        justify-self: end;
      }
    nav.page-nav {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-items: center;
}

nav.page-nav > a.back-link {
  grid-area: 1 / 1;
  justify-self: start;
  text-align: left;
}

nav.page-nav > a.home-link {
  grid-area: 1 / 2;
  justify-self: center;
  text-align: center;
}

nav.page-nav > a.next-link {
  grid-area: 1 / 3;
  justify-self: end;
  text-align: right;
}
  </style>
</head>

<body>
  <div class="page">
    <main class="author-panel">
      <header class="author-header">
        <p class="section-number">09.</p>
        <h1>Author</h1>
        <p class="author-name">Dr. Gavin P. Johnson</p>
      </header>

      <section class="overview" aria-labelledby="overview-heading">
        <h2 id="overview-heading">Overview</h2>
        <p>[Paste Dr. Gavin P. Johnson’s overview here.]</p>
      </section>
    </main>

    <nav class="page-nav" aria-label="Page navigation">
      <a class="back-link" href="index.html">&larr; Back to overview</a>
      <a class="home-link" href="index.html">Go Back</a>
      <a class="next-link" href="contributing-author-2.html">Next tab &rarr;</a>
    </nav>
  </div>
</body>
</html>
