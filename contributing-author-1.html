<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dr. Gavin P. Johnson</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f5ee;
      color: #111111;
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      width: min(94%, 1400px);
      margin: 0 auto;
      padding: clamp(20px, 2.8vw, 40px) 0 24px;
    }

    .author-panel {
      padding: clamp(22px, 4.5vw, 64px);
      border-radius: clamp(18px, 2.2vw, 32px);
      background: #e2d5ee;
    }

    .author-header {
      padding-bottom: clamp(20px, 2.8vw, 40px);
      border-bottom: 1px solid #111111;
    }

    .section-number {
      margin: 0 0 clamp(12px, 1.8vw, 26px);
      color: #48382f;
      font-size: clamp(1.5rem, 3vw, 2.75rem);
      line-height: 1.15;
    }

    .author-header h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 5rem);
      line-height: 0.95;
      text-transform: uppercase;
    }

    .author-name {
      margin: clamp(12px, 1.6vw, 23px) 0 0;
      font-size: clamp(1.2rem, 2.4vw, 2rem);
      font-weight: normal;
      line-height: 1.2;
    }

    .author-photos {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(8px, 2vw, 24px);
      max-width: 828px;
      margin: 24px auto 0;
    }

    .author-photos img {
      display: block;
      width: 100%;
      aspect-ratio: 5 / 7;
      object-fit: cover;
      border-radius: 12px;
    }

    .overview {
      padding-top: clamp(22px, 3vw, 44px);
    }

    .overview h2 {
      margin: 0 0 clamp(20px, 2.8vw, 40px);
      font-size: clamp(1.5rem, 3vw, 2.7rem);
      line-height: 1.15;
      text-align: center;
    }

    .overview p {
      margin: 0;
      font-size: clamp(1.05rem, 2.1vw, 1.9rem);
      line-height: 1.7;
    }

    .overview p + p {
      margin-top: 1em;
    }

    .author-navigation {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: baseline;
      gap: 12px;
      margin-top: clamp(20px, 3vw, 44px);
      font-size: clamp(1rem, 1.85vw, 1.65rem);
    }

    .author-navigation a {
      color: inherit;
      text-underline-offset: 0.2em;
    }

    .overview-link {
      grid-area: 1 / 1;
      justify-self: start;
      text-align: left;
    }

    .home-link {
      grid-area: 1 / 2;
      justify-self: center;
      text-align: center;
    }

    .next-author-link {
      grid-area: 1 / 3;
      justify-self: end;
      text-align: right;
    }

    @media (max-width: 480px) {
      .author-photos {
        grid-template-columns: minmax(0, 260px);
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <main class="author-panel">
      <header class="author-header">
        <p class="section-number">09.</p>
        <h1>Author</h1>
        <p class="author-name">Dr. Gavin P. Johnson</p>

        <div class="author-photos">
          <img src="johnson-left.jpg"
               alt="Describe the left photo">

          <img src="gavin-johnson.jpg"
               alt="Portrait of Dr. Gavin P. Johnson against a purple background">

          <img src="johnson-right.jpg"
               alt="Describe the right photo">
        </div>
      </header>

      <section class="overview" aria-labelledby="overview-heading">
        <h2 id="overview-heading">Overview</h2>
        <p>bkibibik</p>
      </section>
    </main>

    <nav class="author-navigation" aria-label="Page navigation">
      <a class="overview-link" href="index.html">&larr; Back to overview</a>
      <a class="home-link" href="conversation.html">&larr; Go Back</a>
      <a class="next-author-link" href="contributing-author-2.html">Next tab &rarr;</a>
    </nav>
  </div>
</body>
</html>
